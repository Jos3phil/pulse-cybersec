[project]
name = "baryonem-pulse"
version = "0.1.0"
description = "Diagnóstico de evidencia de protección de datos para clínicas"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "pymysql>=1.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contract", "tools", "engine", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: necesita la Clínica Inti encendida en Docker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
